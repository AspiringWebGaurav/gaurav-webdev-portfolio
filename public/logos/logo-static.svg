<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Window -->
  <rect x="30" y="50" width="140" height="80" fill="none" stroke="#9C7FD9" stroke-width="2" rx="5"/>
  
  <!-- Terminal dots -->
  <circle cx="40" cy="62" r="3" fill="#FF5F57"/>
  <circle cx="52" cy="62" r="3" fill="#FFBD2E"/>
  <circle cx="64" cy="62" r="3" fill="#28CA42"/>
  
  <!-- Terminal prompt -->
  <text x="45" y="100" font-family="'Courier New', monospace" font-size="28" fill="#CBACF9">&gt;</text>
  <text x="65" y="100" font-family="'Courier New', monospace" font-size="28" fill="#FFFFFF">gaurav</text>
  
  <!-- Static cursor -->
  <rect x="155" y="78" width="8" height="28" fill="#CBACF9"/>
</svg>