<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Terminal Window -->
  <rect x="30" y="50" width="140" height="80" fill="none" stroke="url(#gradient)" stroke-width="2.5" rx="5"/>
  
  <!-- Terminal dots -->
  <circle cx="40" cy="62" r="3" fill="#FF5F57"/>
  <circle cx="52" cy="62" r="3" fill="#FFBD2E"/>
  <circle cx="64" cy="62" r="3" fill="#28CA42"/>
  
  <!-- Terminal prompt -->
  <text x="45" y="100" font-family="'Courier New', monospace" font-size="28" fill="#8B5CF6">&gt;</text>
  <text x="65" y="100" font-family="'Courier New', monospace" font-size="28" fill="#1F2937" font-weight="600">gaurav</text>
  
  <!-- Static cursor -->
  <rect x="155" y="78" width="8" height="28" fill="#6366F1"/>
</svg>
