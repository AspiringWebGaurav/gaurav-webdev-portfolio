<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A103C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000319" stop-opacity="1" />
    </radialGradient>
    <filter id="lilacGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="108" fill="none" stroke="#CBACF9" stroke-width="2" stroke-opacity="0.2" />

  <!-- Monogram GP Monoline Group -->
  <g transform="translate(14, 0)">
    <!-- G Letter Path: Circular arc around left, curving up to horizontal bridge -->
    <!-- P Letter Path: Stem and top loop interconnected -->
    
    <!-- Outer Violet Glow Layer -->
    <path
      d="M 232 178
         A 102 102 0 1 0 236 332
         L 236 256
         L 272 256
         L 272 170
         L 336 170
         A 44 44 0 0 1 336 258
         L 272 258
         L 272 342"
      fill="none"
      stroke="#CBACF9"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#lilacGlow)"
    />

    <!-- Inner Crisp Platinum Core Layer -->
    <path
      d="M 232 178
         A 102 102 0 1 0 236 332
         L 236 256
         L 272 256
         L 272 170
         L 336 170
         A 44 44 0 0 1 336 258
         L 272 258
         L 272 342"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
